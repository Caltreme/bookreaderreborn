apply plugin: 'com.android.library'

android {
    namespace 'org.geometerplus.zlibrary.ui.android'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.20-sdk35-androidx"
        consumerProguardFiles 'consumer-proguard-rules.pro'

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
        }
    }

    lint {
        disable 'WrongViewCast'
    }
}

dependencies {
    // Dependencias core de AndroidX
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.collection:collection:1.3.0'
    implementation 'androidx.cursoradapter:cursoradapter:1.0.0'

    // Proyectos/librerías locales del repositorio
    implementation project(':ambilWarna')
    implementation project(':androidFileChooser')
    implementation project(':dragSoftListView')
    implementation project(':superToasts')
    implementation project(':pdfparse-lib')
    
    // Librerías de terceros externas
    implementation('com.googlecode.json-simple:json-simple:1.1.1') { 
        exclude group: 'junit' 
    }
    implementation 'org.apache.httpcomponents:httpmime:4.5.2'
    implementation 'com.nanohttpd:nanohttpd:2.1.0'
}
