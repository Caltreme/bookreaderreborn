android {
    namespace 'com.github.axet.bookreader'
    compileSdk 35

    defaultConfig {
        applicationId "com.github.axet.bookreader"
        minSdk 21  // o superior, 21 es un buen estándar actual
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
